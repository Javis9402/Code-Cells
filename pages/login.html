<!doctype html>
<html lang="es">

<head>
    <!--TODO  CDN de Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- TODO Google Fonts: Istok Web -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:wght@400;700&display=swap" rel="stylesheet" />
    <!-- TODO Nuestro archivo CSS personalizado -->
    <link rel="stylesheet" defer href="/assets/css/contactanos.css" />
    <link rel="stylesheet" href="/assets/css/registro.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión InstaRama</title>
</head>

<body>

    <!--TODO HEADER -->
    <header class="header-instarama py-3">
        <div class="container-fluid d-flex justify-content-end align-items-center h-100">
            <a href="registro.html" class="btn-iniciar">Registrarse</a>
        </div>
    </header>

    <!-- TODO Contenedor principal: Ocupa el resto de la pantalla y centra el contenido -->
    <div class="container main-content d-flex justify-content-center align-items-center">
        <!-- Fila principal: Divide la pantalla en dos columnas -->
        <div class="row w-100 justify-content-center align-items-center">
            <!-- TODO COLUMNA IZQUIERDA: Logo y Nombre -->


            <!-- TODO COLUMNA DERECHA: Formulario de Registro -->
            <div class="col-md-5">

                <div class="col-md-6 text-center mb-5 mb-md-0 w-100 fs-1">
                    <!--  TODO Enlace al Feed con el Logo -->
                    <a href="../index.html" class="d-block mb-3 logo-link">
                        <img src="../assets/img/mode-clear/logoInstarama-Login(ficticio).svg" alt="Logo de InstaRama"
                            class="img-fluid logo-img w-25" />
                    </a>
                </div>

                <h2 class="mb-4 form-title">Inicio de Sesión</h2>

                <form action="#" method="POST">
                    <!-- Campo: Nombre de usuario -->
                    <div class="mb-3">
                        <label for="username" class="form-label fs-4">Nombre de usuario.</label>
                        <input type="text" class="form-control" id="username" required />
                    </div>

                    <!-- Campo: Contraseña -->
                    <div class="mb-3">
                        <label for="password" class="form-label fs-4">Contraseña.</label>
                        <input type="password" class="form-control" id="password" required />
                    </div>

                    <div id="alert-container" class="mb-3"></div>

                    <!-- TODO Checkboxes -->
                    <div class="mb-4">
                        <a class="form-check-label" href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- TODO  Botón de envío -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-lg custom-btn fs-4">
                            Ingresar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- TODO CDN de Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/registro.js"></script>
</body>

</html>
