<body>
  <!-- TODO Contenedor principal: Ocupa el resto de la pantalla y centra el contenido -->
  <section class="registro-page">
    <div class="container">

      <div class="row align-items-center min-vh-100">

        <!--Columna izquierda-->
        <div class="col-lg-6 d-flex align-items-end">
          <div class="registro-info">
            <h1>¡Únete y explora!</h1>
            <p>
              Comparte lo que encuentras y descubre lo que otros observan
            </p>
          </div>
        </div><!--Fin columna izquierda-->

        <!--Columna derecha-->
        <div class="col-lg-6 d-flex justify-content-center">
          <div class="registro-card">
            <img src="/assets/img/logo/logo.svg" class="logo-registro" alt="Logo de instaRama">
            <h2 class="form-title">InstaRama</h2>
            <p class="registro-login">¿Ya tienes una cuenta? <a href="/pages/login.html">Ingresa aquí</a></p>

            <!--Formulario-->
            <form action="#" method="POST">
              <!-- Campo: Nombre de usuario -->
              <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario.</label>
                <input type="text" class="form-control" id="username" required />
              </div>

              <!-- Campo: Correo electrónico -->
              <div class="mb-3">
                <label for="email" class="form-label">Correo electronico.</label>
                <input type="email" class="form-control" id="email" required />
              </div>

              <!-- Campo: Contraseña -->
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña.</label>
                <input type="password" class="form-control" id="password" required />
              </div>

              <!-- Campo: Confirmar Contraseña -->
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar contraseña.</label>
                <input type="password" class="form-control" id="confirmPassword" required />
              </div>

              <div id="alert-container" class="mb-3"></div>

              <!-- TODO Checkboxes -->
              <div class="mb-4">
                <div class="form-check mb-2">
                  <input type="checkbox" class="form-check-input" id="rememberMe" />
                  <label class="form-check-label" for="rememberMe">Recuérdame</label>
                </div>
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="terms" required />
                  <label class="form-check-label" for="terms">Acepto términos y condiciones</label>
                </div>
              </div>

              <!-- TODO  Botón de envío -->
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-lg custom-btn">
                  Crear mi cuenta
                </button>
              </div>
            </form><!--Fin formulario-->
          </div><!--Fin registro card-->
        </div><!--Fin columna derecha-->

      </div><!--Fin row-->
    </div><!--Fin container-->
  </section><!--Fin section-->

  <!-- TODO: CDN de Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
