    <!--? Contenedor de fondo -->
    <div class="fondo-responsivo flex-grow-1 d-flex justify-content-center">
        <div class="bg-white rounded-4 shadow-sm w-75 overflow-hidden align-self-start">
            <div class="bg-white rounded-4 shadow-sm contenedor-publicacion overflow-hidden">

                <!-- Barra superior -->
                <div class="d-flex align-items-center gap-3 px-3 py-2 border-bottom">
                    <input class="form-check-input m-0" type="checkbox" id="seleccionar-todas"
                        aria-label="Seleccionar todas" />
                    <button type="button" class="btn btn-sm btn-outline-danger d-none" id="btn-eliminar-seleccionadas">
                        Eliminar seleccionadas
                    </button>
                    <span class="ms-auto text-muted small" id="contador-publicaciones"></span>
                </div>

                <!-- Lista de notificaciones -->
                <ul class="list-unstyled m-0" id="lista-publicaciones"></ul>

                </ul>
            </div>
        </div>
    </div>
    <!--? Fin del contenedor de fondo -->

    <!--TODO : Modal para editar publicación -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="tituloModalEditar" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable w-100">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="tituloModalEditar">Editar publicación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <form id="formularioEditar" novalidate>

                        <!--* Imagen -->
                        <div class="mb-3">
                            <label for="editarArchivo" class="form-label fw-semibold">Cambiar imagen (opcional)</label>
                            <input class="form-control" type="file" id="editarArchivo" accept="image/*" />
                        </div>

                        <figure class="figure text-center d-block my-3">
                            <img id="editarPreview" src=""
                                class="figure-img img-fluid rounded mx-auto d-block shadow-sm" alt="Vista previa"
                                style="max-height: 300px; object-fit: contain;" />
                            <figcaption class="figure-caption text-center mt-2">Vista previa</figcaption>
                        </figure>

                        <!--? Categoría -->
                        <div class="mb-4">
                            <label for="editarCategoria" class="form-label fw-semibold">Tipo de descubrimiento</label>
                            <select class="form-select" id="editarCategoria">
                                <option value="" disabled>Selecciona una categoría...</option>
                                <option value="Monera">🧫 Reino Monera</option>
                                <option value="Protista">🦠 Reino Protista</option>
                                <option value="Fungi">🍄 Reino Fungi</option>
                                <option value="Plantae">🌿 Reino Plantae</option>
                                <option value="Animalia">🐾 Reino Animalia</option>
                                <option value="Sin Clasificar">ℹ️ Desconozco la clasificación</option>
                            </select>
                            <div class="invalid-feedback">¡Por favor elige la categoría de tu descubrimiento!</div>
                        </div>

                        <!--? Subcategoría Animalia -->
                        <div class="mb-4 d-none" id="editarContenedorSub">
                            <label for="editarSubCategoria" class="form-label fw-semibold">Clasificación de
                                Animalia</label>
                            <select class="form-select" id="editarSubCategoria">
                                <option value="" disabled>¿Es vertebrado o invertebrado?</option>
                                <option value="Vertebrado">🦴 Vertebrado</option>
                                <option value="Invertebrado">🐛 Invertebrado</option>
                            </select>
                            <div class="invalid-feedback">Elige si es vertebrado o invertebrado.</div>
                        </div>

                        <!--* Título -->
                        <div class="mb-3">
                            <label for="editarTitulo" class="form-label fw-semibold">Título del hallazgo</label>
                            <input type="text" class="form-control" id="editarTitulo" />
                            <div class="invalid-feedback">¡Espera! No has agregado un título.</div>
                        </div>

                        <!--* Descripción -->
                        <div class="mb-4">
                            <label for="editarDescripcion" class="form-label fw-semibold">Descripción</label>
                            <textarea class="form-control" id="editarDescripcion" style="height: 100px"></textarea>
                            <div class="invalid-feedback">¡Aún no has comentado tu hallazgo!</div>
                        </div>

                        <!--* Botones -->
                        <div class="d-flex gap-3 justify-content-center">
                            <button class="btn btn-verde w-50" type="submit">Guardar cambios</button>
                            <button class="btn btn-outline-oscuro w-50" type="button"
                                data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!--TODO : FIN DE Modal para editar publicación -->

    <!-- VENTANA FLOTANTE DE LA PUBLICACIÓN -->
    <div class="modal fade ir-modal" id="modal-publicacion" tabindex="-1" aria-labelledby="modal-titulo"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-xl">
            <div class="modal-content">
                <button type="button" class="btn-close ir-modal-close" data-bs-dismiss="modal"
                    aria-label="Cerrar"></button>
                <div class="modal-body p-0">
                    <div class="row g-0">
                        <div class="col-md-6 ir-modal-media">
                            <img id="modal-imagen" src="" alt="" />
                        </div>
                        <div class="col-md-6 ir-modal-info">
                            <p class="ir-modal-autor">
                                Publicado por <strong id="modal-usuario"></strong>
                            </p>
                            <h2 id="modal-titulo" class="ir-modal-titulo"></h2>
                            <p id="modal-descripcion"></p>
                            <dl id="modal-datos" class="ir-modal-datos"></dl>
                            <h3 class="ir-modal-subtitulo">💬 Comentarios</h3>
                            <div id="modal-comentarios" class="ir-modal-comentarios"></div>
                            <div class="input-group">
                                <input type="text" id="modal-input" class="form-control"
                                    placeholder="Escribe un comentario..." />
                                <button type="button" id="modal-comentar" class="btn btn-success">
                                    Comentar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
